<button class="btn-wrapper"
        [ngClass]="[bgrColor, txtColor, priority ? priority : '']"
        [class.border]="outlined"
        (click)="onClick()"
        type="{{buttonType}}">
    <span class="btn-text">{{ text }}</span>
    @if (icon) {
        <img class="navigation-icon" src="../../../../assets/icons/{{icon}}.svg" alt="{{ icon }}.svg">
    }
</button>
