<app-subheadline [text]="'Home.Board.Headline' | translate" [subtext]="'Home.Board.SubHeadline' | translate"
    [line]="true">
</app-subheadline>

<section class="upper-section-wrapper">
    <div class="upper-section">
        <!--        <mat-form-field appearance="outline">-->
        <!--            <mat-label>{{'Home.Board.FindTask' | translate}}</mat-label>-->
        <!--            <input type="text" matInput>-->
        <!--            <mat-icon matSuffix>search</mat-icon>-->
        <!--        </mat-form-field>-->
        <app-button [bgrColor]="'surface-dark-color'" [icon]="'add'" [text]="'Home.Board.AddTask' | translate"
            [txtColor]="'surface-dark-contrast-color'" (click)="showAddTask = true">
        </app-button>
    </div>
</section>

<section class="board-wrapper">
    <div class="board-section">
        @for (head of headlines; track headlines; let i = $index) {
        <div class="headline-wrapper">
            <span class="headline">{{ 'Home.Board.' + head | translate }}</span>
            <img class="add-icon" src="assets/icons/add_dark.svg" alt="add">
        </div>
        <div class="board-subsection">
            <section class="drag-area" id="{{head}}" cdkDropList [cdkDropListConnectedTo]="filterHeadlines(head)"
                [cdkDropListData]="head" (cdkDropListDropped)="drop($event)">

                @if (tasks!.length > 0) {
                    @for (task of tasks; track trackByTaskId; let idx = $index) {
                        @if (task.posStatus === head) {
                        <app-task [task]="task" id="drag{{idx}}" cdkDrag></app-task>
                        }
                    }
                } 
            </section>

        </div>
        }

    </div>


</section>
