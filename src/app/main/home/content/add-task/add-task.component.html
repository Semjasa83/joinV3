<div class="route-headline-wrapper">
    <span class="route-headline route-line">Add Task</span>
    <span class="route-sub-headline">Organize your Mind</span>
</div>

<app-input-field placeholder="{{'Home.Tasks.Title' | translate}}" [inputType]="'text'"></app-input-field>
<textarea placeholder="{{'Home.Tasks.Description' | translate}}"></textarea>
<select>
  <option value="">{{'Home.Tasks.Assign' | translate}}</option>
</select>
<app-input-field placeholder="{{'Home.Tasks.Date' | translate}}" [inputType]="'date'"></app-input-field>
<select>
  <option value="">{{'Home.Tasks.Category' | translate}}</option>
</select>
